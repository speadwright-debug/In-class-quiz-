<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quiz</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="kicker">Science · self-check quiz</div>
    <h1><a href="index.html">Quizzes</a></h1>
  </header>

  <noscript>
    <div class="noscript-msg">
      <h2>JavaScript is needed</h2>
      <p>This quiz needs JavaScript to run. It looks like it is turned off in
      your browser. Turn it on, or ask your teacher for help.</p>
    </div>
  </noscript>

  <main id="app">
    <!-- Filled in by app.js -->
    <p class="muted" id="boot-status">Loading quiz…</p>
  </main>

  <!-- Screen-reader announcements (score, errors) -->
  <div id="live" aria-live="polite" class="visually-hidden" style="position:absolute;left:-9999px;"></div>

  <script src="js/config.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
