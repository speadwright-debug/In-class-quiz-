<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Science quizzes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="kicker">Science · self-check quizzes</div>
    <h1><a href="index.html">Quizzes</a></h1>
  </header>

  <noscript>
    <div class="noscript-msg">
      <h2>JavaScript is needed</h2>
      <p>This quiz site needs JavaScript to run. It looks like it is turned off
      in your browser. Turn it on, or ask your teacher for help.</p>
    </div>
  </noscript>

  <main>
    <div class="field">
      <label for="year-filter">Year level</label>
      <select id="year-filter">
        <option value="">All years</option>
      </select>
    </div>

    <ul class="quiz-list" id="quiz-list" aria-live="polite"></ul>
    <p class="muted" id="list-status">Loading quizzes…</p>
  </main>

  <script src="js/validate.js"></script>
  <script>
    (async function () {
      const listEl = document.getElementById("quiz-list");
      const statusEl = document.getElementById("list-status");
      const yearSel = document.getElementById("year-filter");
      let entries = [];

      function render() {
        const year = yearSel.value;
        listEl.innerHTML = "";
        const visible = entries.filter(
          (e) => e.published === true && (!year || e.yearLevel === year)
        );
        if (visible.length === 0) {
          statusEl.textContent = "No quizzes here yet.";
          return;
        }
        statusEl.textContent = "";
        for (const e of visible) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "quiz.html?quiz=" + encodeURIComponent(e.quizId);
          const t = document.createElement("div");
          t.className = "quiz-title";
          t.textContent = e.title;
          const m = document.createElement("div");
          m.className = "quiz-meta";
          m.textContent = [e.yearLevel, e.subtitle].filter(Boolean).join(" · ");
          a.append(t, m);
          li.appendChild(a);
          listEl.appendChild(li);
        }
      }

      try {
        const res = await fetch("quizzes/index.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const errs = validateIndex(data);
        if (errs.length) {
          statusEl.innerHTML = "";
          const box = document.createElement("div");
          box.className = "notice problem";
          box.innerHTML = "<strong>Quiz list could not load.</strong>";
          const ul = document.createElement("ul");
          errs.forEach((e) => {
            const li = document.createElement("li");
            li.textContent = e;
            ul.appendChild(li);
          });
          box.appendChild(ul);
          statusEl.replaceWith(box);
          return;
        }
        entries = data.quizzes;
        const years = [...new Set(entries.filter(e => e.published).map((e) => e.yearLevel).filter(Boolean))].sort();
        for (const y of years) {
          const opt = document.createElement("option");
          opt.value = y;
          opt.textContent = y;
          yearSel.appendChild(opt);
        }
        yearSel.addEventListener("change", render);
        render();
      } catch (err) {
        statusEl.textContent =
          "Could not load the quiz list (quizzes/index.json). Check the file exists and is valid JSON. Detail: " +
          err.message;
        statusEl.className = "notice problem";
      }
    })();
  </script>
</body>
</html>
